version: '3.8'

services:
  alpr_rtsp_service:
    build: .
    container_name: alpr_rtsp_service
    ports:
      - "5003:5003"
    volumes:
      - ./configs:/app/configs
      - ./images_logs:/app/images_logs
      - ./tests:/app/tests  # สำหรับ test video file
    environment:
      - HOST=0.0.0.0
      - PORT=5003
      - ENVIRONMENT=production
      - PLATE_RECOGNIZER_URL=http://plate_recognizer:5000/api/v1/image/process
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=alpr_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres
    networks:
      - alpr_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: alpr_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alpr_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - alpr_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  alpr_network:
    driver: bridge
