# Development Mode Override
# Usage: docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Copy .env.dev.example -> .env.dev and fill in your values

services:
  nextjs-app:
    build:
      context: ./alpr_web
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_BASE_API_GATE_WAY_URL: ${SERVER_URL}/api/general
        NEXT_PUBLIC_API_UPLOAD_IMAGE: ${SERVER_URL}/api/image
        NEXT_PUBLIC_WEBSOCKET_VIDEO_HANLER: ${WS_URL}/ws/video
        NEXT_PUBLIC_RTSP_SERVICE_URL: ${SERVER_URL}/api/rtsp
        NEXT_PUBLIC_RTSP_WEBSOCKET_URL: ${WS_URL}/api/rtsp/stream
    command: npm run dev
    volumes:
      - ./alpr_web/src:/app/src
      - ./alpr_web/public:/app/public
      - ./alpr_web/next.config.mjs:/app/next.config.mjs
      - ./alpr_web/tsconfig.json:/app/tsconfig.json
      - ./alpr_web/package.json:/app/package.json
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_BASE_API_GATE_WAY_URL: ${SERVER_URL}/api/general
      NEXT_PUBLIC_API_UPLOAD_IMAGE: ${SERVER_URL}/api/image
      NEXT_PUBLIC_WEBSOCKET_VIDEO_HANLER: ${WS_URL}/ws/video
      NEXT_PUBLIC_RTSP_SERVICE_URL: ${SERVER_URL}/api/rtsp
      NEXT_PUBLIC_RTSP_WEBSOCKET_URL: ${WS_URL}/api/rtsp/stream
      # Enable hot reload
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

  fastapi_image_container:
    environment:
      APP_ENV: development

  alpr-api-web-gateway:
    environment:
      APP_ENV: development

  alpr_rtsp_service:
    environment:
      APP_ENV: development
