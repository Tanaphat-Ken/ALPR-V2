events {
    worker_connections 1024;
}

http {
    upstream plate_backend {
        # Load Balancing (Round Robin) สำหรับ Plate Recognition Service
        server plate-recognizer:5000;
        # เพิ่ม instance เพิ่มเติมได้ เช่น:
        # server plate-recognizer-2:5000;
        # server plate-recognizer-3:5000;
    }

    server {
        listen 80;
        server_name _;

        # Docker internal DNS resolver — ทำให้ nginx resolve hostname ใหม่ทุก 30s
        # ป้องกัน 502 เมื่อ container ถูก rebuild แล้วได้ IP ใหม่
        resolver 127.0.0.11 valid=30s ipv6=off;
        
        # อนุญาตให้อัปโหลดไฟล์ขนาดสูงสุด 10MB (สำหรับรูปภาพป้ายทะเบียน)
        client_max_body_size 10M;
        
        # ปิด Server Version Token
        server_tokens off;
        
        # Proxy Headers เพื่อส่งต่อ Real IP ของ User ไปยัง Services ข้างหลัง
        proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Plate Recognition API - ส่งไปยัง upstream plate_backend
    location /api/v1/image/ {
        proxy_pass http://plate_backend/api/v1/image/;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ============================================
    # Routes สำหรับ Services อื่นๆ (Optional)
    # ============================================
    
    # Image Upload API
    location /api/image/ {
        rewrite ^/api/image/(.*) /api/v1/images/$1 break;
        proxy_pass http://fastapi_image_container:8089;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # General API (Authentication, Payment, Subscription, etc.)
    location /api/general/ {
        rewrite ^/api/general/(.*) /api/v1/$1 break;
        proxy_pass http://alpr-api-web-gateway:8092;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # WebSocket for Image Processing
    location /ws/image/ {
        rewrite ^/ws/image/(.*) /ws/v1/$1 break;
        proxy_pass http://image-websocket-container:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # WebSocket for Video Processing
    location /ws/video/ {
        rewrite ^/ws/video/(.*) /$1 break;
        proxy_pass http://video-handler:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # RTSP Service WebSocket (stream viewer) - ต้องอยู่ก่อน /api/rtsp/
    location /api/rtsp/stream/ {
        set $rtsp_upstream http://alpr_rtsp_service:5003;
        rewrite ^/api/rtsp/(.*) /api/v1/$1 break;
        proxy_pass $rtsp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # RTSP Service API
    location /api/rtsp/ {
        set $rtsp_upstream http://alpr_rtsp_service:5003;
        rewrite ^/api/rtsp/(.*) /api/v1/$1 break;
        proxy_pass $rtsp_upstream;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Next.js Frontend (Default Route)
    # ต้องเป็น location สุดท้ายเพื่อจับ requests ที่เหลือทั้งหมด
    location / {
        proxy_pass http://nextjs-app:3000;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # สำหรับ Next.js HMR (Hot Module Replacement) ใน development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    }
}
